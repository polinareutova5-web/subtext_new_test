<div class="login-card">

  <div class="badge">
    ПРЕПОДАВАТЕЛЬ
  </div>

  <h2>👩‍🏫 Teacher Portal</h2>

  <div class="subtitle">
    Вход в личный кабинет преподавателя
  </div>

  <div id="error-msg" class="error"></div>

  <input
    type="text"
    id="login"
    placeholder="Логин"
    autocomplete="username"
  >

  <input
    type="password"
    id="password"
    placeholder="Пароль"
    autocomplete="current-password"
  >

  <button onclick="handleLogin()">
    Войти в систему
  </button>

  <a href="index.html" class="back-link">
    ← Вернуться ко входу для учеников
  </a>

</div>
